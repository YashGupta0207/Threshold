services:
  - type: web
    name: threadnotes-cloud-vault
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn --app-dir desktop-backend/vault main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # The pinned deps (pydantic 2.9.2, httpx 0.24.1) predate Python 3.13 and
      # have no wheels for it. Match the 3.11 the Dockerfile used.
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: JWT_SECRET
        generateValue: true

      # --- AI Gateway ---------------------------------------------------------
      # Every Azure + Cosmos secret is fetched from the gateway once at startup
      # by desktop-backend/vault/gateway_credentials.py. That is why none of
      # AZURE_* / COSMOS_* appear below: setting them here would be ignored in
      # favour of the gateway, and they are commented out in .env for the same
      # reason. GATEWAY_PROVIDERS supplies:
      #   Cosmosdb       -> COSMOS_KEY, COSMOS_ENDPOINT, COSMOS_DATABASE,
      #                     COSMOS_USERS_CONTAINER
      #   AzureOpenAI    -> AZURE_OPENAI_KEY, AZURE_OPENAI_ENDPOINT,
      #                     AZURE_TRANSCRIBE_DEPLOYMENT, AZURE_DIARIZE_DEPLOYMENT
      #   AzureSpeechKey -> AZURE_SPEECH_KEY, AZURE_SPEECH_REGION
      - key: DXAI_API_KEY
        sync: false
      - key: DXAI_BASE_URL
        value: https://ai-gateway-platform-cex4.onrender.com
      - key: GATEWAY_PROVIDERS
        value: Cosmosdb,AzureOpenAI,AzureSpeechKey,gemini
      - key: GATEWAY_TIMEOUT
        value: "60"
      - key: GATEWAY_PROXY_AI
        value: "true"
      - key: GATEWAY_PROXY_SUMMARY
        value: "true"
      - key: GATEWAY_AI_PROVIDER
        value: AzureOpenAI

      # --- Email (Brevo HTTP API; Render's free tier blocks outbound SMTP) -----
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: ThreadNotes

      # --- Admin web panel credentials ---------------------------------------
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
